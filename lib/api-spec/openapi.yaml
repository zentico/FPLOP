openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projections
    description: Points projection files
  - name: solves
    description: Optimization runs
  - name: fpl
    description: Official FPL data
  - name: accuracy
    description: Official results archive and projection accuracy
paths:
  /results:
    get:
      operationId: listResults
      tags: [accuracy]
      summary: Archived official gameweek results
      responses:
        "200":
          description: One entry per archived season/gameweek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultArchiveInfo"
  /results/refresh:
    post:
      operationId: refreshResults
      tags: [accuracy]
      summary: Archive official results for finished gameweeks not yet stored
      responses:
        "200":
          description: Newly archived gameweeks and the full archive list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResultsOutput"
        "502":
          description: FPL API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /accuracy:
    get:
      operationId: getAccuracy
      tags: [accuracy]
      summary: Accuracy of each source's pre-deadline snapshot per archived gameweek
      responses:
        "200":
          description: One entry per source and archived gameweek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccuracyEntry"
  /accuracy/{projectionId}/detail/{gameweek}:
    get:
      operationId: getAccuracyDetail
      tags: [accuracy]
      summary: Player-level prediction errors for one snapshot and gameweek
      parameters:
        - name: projectionId
          in: path
          required: true
          schema:
            type: string
        - name: gameweek
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Largest misses first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccuracyMiss"
        "404":
          description: Projection or archived results not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projections:
    get:
      operationId: listProjections
      tags: [projections]
      summary: List uploaded projection files
      responses:
        "200":
          description: List of projection files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Projection"
    post:
      operationId: uploadProjection
      tags: [projections]
      summary: Upload a points projection CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionInput"
      responses:
        "201":
          description: Uploaded projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          description: Invalid CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/import:
    post:
      operationId: importProjection
      tags: [projections]
      summary: Import a points projection from an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProjectionInput"
      responses:
        "201":
          description: Imported projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: The source session has expired and needs to be refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: The source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/blend/preview:
    post:
      operationId: previewProjectionBlend
      tags: [projections]
      summary: Preview a weighted blend of saved projections without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlendPreviewInput"
      responses:
        "200":
          description: Blended preview (same values a solve would use)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlendPreview"
        "400":
          description: Invalid weights or no shared consecutive gameweeks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: A component projection was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /fixtures:
    get:
      operationId: listFixtures
      tags: [projections]
      summary: All season fixtures with team short names
      responses:
        "200":
          description: Fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FixtureInfo"
        "502":
          description: FPL API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/{id}/csv:
    get:
      operationId: downloadProjectionCsv
      tags: [projections]
      summary: Download the raw projection CSV file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The CSV file
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /settings/ffh-session:
    get:
      operationId: getFfhSessionStatus
      tags: [projections]
      summary: Whether a Fantasy Football Hub session cookie is configured
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FfhSessionStatus"
    post:
      operationId: updateFfhSession
      tags: [projections]
      summary: Save a new Fantasy Football Hub session cookie after validating it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FfhSessionInput"
      responses:
        "200":
          description: Cookie validated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FfhSessionStatus"
        "400":
          description: Cookie invalid or rejected by Fantasy Football Hub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Fantasy Football Hub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/{id}:
    delete:
      operationId: deleteProjection
      tags: [projections]
      summary: Delete a projection file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/{id}/players:
    get:
      operationId: getProjectionPlayers
      tags: [projections]
      summary: Top projected players in a projection file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Players sorted by total projected points over the horizon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectedPlayer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projections/{id}/pool-stats:
    get:
      operationId: getProjectionPoolStats
      tags: [projections]
      summary: Per-player pool stats (price, points per match) for pool filtering
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One entry per player in the projection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoolPlayerStat"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /fpl/gameweek:
    get:
      operationId: getGameweekInfo
      tags: [fpl]
      summary: Current gameweek info from the official FPL API
      responses:
        "200":
          description: Gameweek info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameweekInfo"
  /fpl/team/{teamId}:
    get:
      operationId: getFplTeam
      tags: [fpl]
      summary: Fetch an FPL team by team code from the official FPL site
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FplTeam"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /solves:
    get:
      operationId: listSolves
      tags: [solves]
      summary: List optimization runs, most recent first
      responses:
        "200":
          description: List of solve runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SolveRun"
    delete:
      operationId: deleteAllSolves
      tags: [solves]
      summary: Delete all historical runs and chip analyses (active ones are kept)
      responses:
        "204":
          description: Deleted
    post:
      operationId: createSolve
      tags: [solves]
      summary: Start an optimization run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveInput"
      responses:
        "201":
          description: Solve run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveRun"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /solves/mega:
    get:
      operationId: listMegaSolves
      tags: [solves]
      summary: List chip-strategy analysis runs, most recent first
      responses:
        "200":
          description: List of mega runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MegaRun"
    post:
      operationId: createMegaSolve
      tags: [solves]
      summary: Start a chip-strategy analysis (6 sequential solves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveInput"
      responses:
        "201":
          description: Mega run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MegaRun"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /solves/mega/{id}:
    get:
      operationId: getMegaSolve
      tags: [solves]
      summary: Get a chip-strategy analysis with per-scenario results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mega run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MegaRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteMegaSolve
      tags: [solves]
      summary: Delete a chip-strategy analysis and its scenario runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /solves/{id}:
    get:
      operationId: getSolve
      tags: [solves]
      summary: Get a solve run with its result when completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solve run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteSolve
      tags: [solves]
      summary: Delete a solve run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Projection:
      type: object
      required: [id, filename, uploadedAt, playerCount, gameweeks]
      properties:
        id:
          type: string
        filename:
          type: string
        uploadedAt:
          type: string
        playerCount:
          type: number
        gameweeks:
          type: array
          description: Gameweek numbers covered by the projection file
          items:
            type: number
        source:
          type: string
          description: Stable source key ("upload", "ffh", "drafthound"); legacy entries omit it
        sourceLabel:
          type: string
          description: Human-readable source name
        sourceUpdatedAt:
          type: string
          description: When the source reported its data was last updated (ISO)
        season:
          type: string
          description: Season the snapshot belongs to, e.g. "2026/27"
        sourcePlayerCount:
          type: number
          description: Players in the upstream feed before FPL identity matching (sources that match players only); playerCount/sourcePlayerCount is the match coverage
        components:
          type: array
          items:
            $ref: "#/components/schemas/BlendComponent"
          description: For blended snapshots (source "blend"), the component snapshots and their normalized weights
    BlendSource:
      type: object
      required: [projectionId, weight]
      properties:
        projectionId:
          type: string
          description: Saved projection snapshot id
        weight:
          type: number
          minimum: 0
          description: Non-negative source weight; weights are normalized globally across all sources
    BlendComponent:
      type: object
      required: [projectionId, filename, weight]
      properties:
        projectionId:
          type: string
        filename:
          type: string
        weight:
          type: number
          description: Normalized weight (all components sum to 1)
    BlendPreviewInput:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BlendSource"
          description: Projections to blend with their raw (unnormalized) weights
    BlendPreview:
      type: object
      required: [gameweeks, playerCount, hasOwnership, components, players, poolStats]
      properties:
        gameweeks:
          type: array
          items:
            type: number
          description: Consecutive gameweeks covered by every component (the blend's horizon)
        playerCount:
          type: number
          description: Players in the blended projection (union of component players)
        hasOwnership:
          type: boolean
          description: True when every component has ownership data (differential factor usable)
        components:
          type: array
          items:
            $ref: "#/components/schemas/BlendComponent"
        players:
          type: array
          items:
            $ref: "#/components/schemas/ProjectedPlayer"
          description: Top blended players by total projected points
        poolStats:
          type: array
          items:
            $ref: "#/components/schemas/PoolPlayerStat"
          description: Per-player pool stats computed from the blended values
    ProjectionInput:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
        content:
          type: string
          description: Raw CSV file content
    FfhSessionStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
    FfhSessionInput:
      type: object
      required: [cookie]
      properties:
        cookie:
          type: string
          description: Value of the appSession cookie (chunks concatenated if split)
    ImportProjectionInput:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: External source id, "ffh" (Fantasy Football Hub), "drafthound" (DraftHound), "pundit" (Fantasy Football Pundit assume-starting points), "pundit-ffh" (Pundit points × FFH expected minutes hybrid), or "fantalens" (FantaLens public expected points and minutes).
        maxGameweeks:
          type: number
          minimum: 1
          maximum: 38
          description: How many upcoming whole gameweeks to import (default 10, clamped to 1-38)
    ResultArchiveInfo:
      type: object
      required: [season, gameweek, deadline, fetchedAt, playerCount]
      properties:
        season:
          type: string
        gameweek:
          type: number
        deadline:
          type: string
          description: Gameweek deadline (ISO); snapshots must predate this to count
        fetchedAt:
          type: string
        playerCount:
          type: number
    RefreshResultsOutput:
      type: object
      required: [archived, results]
      properties:
        archived:
          type: array
          description: Gameweeks newly archived by this refresh
          items:
            type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultArchiveInfo"
    AccuracyEntry:
      type: object
      required:
        [source, sourceLabel, season, gameweek, projectionId, projectionFilename, snapshotAt, sampleSize, coverage, mae, rmse, bias, arpm, crpm]
      properties:
        source:
          type: string
        sourceLabel:
          type: string
        season:
          type: string
        gameweek:
          type: number
        projectionId:
          type: string
        projectionFilename:
          type: string
        snapshotAt:
          type: string
          description: When the winning pre-deadline snapshot was captured
        sampleSize:
          type: number
          description: Players present in both the snapshot and official results
        coverage:
          type: number
          description: Matched players / players who actually played (0-1)
        mae:
          type: number
        rmse:
          type: number
        bias:
          type: number
          description: Mean of predicted minus actual; positive means over-prediction
        correlation:
          type: number
          nullable: true
          description: Pearson correlation between predicted and actual points
        arpm:
          type: number
          description: 100 times the mean absolute predicted-vs-actual percentile-rank miss; lower is better
        crpm:
          type: number
          description: Sum across all matched players of the absolute difference between cubed inverse predicted and actual percentile ranks; lower is better and misses among highly ranked players receive greater weight
    AccuracyMiss:
      type: object
      required: [playerId, name, team, position, predicted, actual, error]
      properties:
        playerId:
          type: number
        name:
          type: string
        team:
          type: string
        position:
          type: string
        predicted:
          type: number
        actual:
          type: number
        error:
          type: number
          description: Predicted minus actual
    ProjectedPlayer:
      type: object
      required: [name, team, position, price, totalPoints]
      properties:
        name:
          type: string
        team:
          type: string
        position:
          type: string
          description: One of G, D, M, F
        price:
          type: number
        totalPoints:
          type: number
          description: Sum of projected points across the horizon
        pointsPerGameweek:
          type: array
          items:
            $ref: "#/components/schemas/GameweekPoints"
    GameweekPoints:
      type: object
      required: [gameweek, points]
      properties:
        gameweek:
          type: number
        points:
          type: number
    GameweekInfo:
      type: object
      required: [nextGameweek, isFirstGameweek]
      properties:
        nextGameweek:
          type: number
        isFirstGameweek:
          type: boolean
        deadline:
          type: ["string", "null"]
          description: ISO deadline of the next gameweek
    FplTeam:
      type: object
      required: [teamId, name, managerName, bank, squad]
      properties:
        teamId:
          type: number
        name:
          type: string
        managerName:
          type: string
        overallRank:
          type: ["number", "null"]
        totalPoints:
          type: ["number", "null"]
        bank:
          type: number
          description: Money in the bank, in millions
        squad:
          type: array
          items:
            $ref: "#/components/schemas/FplSquadPlayer"
    FplSquadPlayer:
      type: object
      required: [playerId, name, team, position, sellPrice]
      properties:
        playerId:
          type: number
        name:
          type: string
        team:
          type: string
        position:
          type: string
        sellPrice:
          type: number
    ChipAssignment:
      type: object
      required: [chip, gameweek]
      properties:
        chip:
          type: string
          description: One of wildcard, bench_boost, free_hit, triple_captain
        gameweek:
          type: number
          description: >
            Gameweek to play the chip, or 0 for "Any" — the solver is then
            required to play the chip but chooses the optimal week itself.
    SolveInput:
      type: object
      required: [projectionId, firstGameweek]
      properties:
        projectionId:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BlendSource"
          description: >
            Weighted blend of saved snapshots. With two or more sources the
            server materializes an immutable blended snapshot when the solve
            starts and solves against it; projectionId is rewritten to the
            blended snapshot's id and the normalized weights are recorded.
            With zero or one source the solve behaves exactly as before.
        firstGameweek:
          type: boolean
          description: True when there is no existing team and a full squad is optimized from scratch
        teamId:
          type: ["number", "null"]
          description: FPL team code, required when firstGameweek is false
        horizon:
          type: number
          description: Number of gameweeks to optimize over (default 5)
        differentialFactor:
          type: number
          description: >
            Differential factor k as a fraction (e.g. 0.2 for 20%). Each player's
            projected points are scaled by 1 + k * (100 - ownership%) / 100 before
            optimization. Requires the projection to include an Ownership column.
        poolFilter:
          oneOf:
            - $ref: "#/components/schemas/PoolFilter"
            - type: "null"
        chips:
          type: array
          items:
            $ref: "#/components/schemas/ChipAssignment"
        options:
          oneOf:
            - $ref: "#/components/schemas/SolveOptions"
            - type: "null"
    PoolPlayerStat:
      type: object
      required: [id, name, position, team, price, ppm, gwPoints]
      properties:
        id:
          type: number
          description: FPL player id
        name:
          type: string
        position:
          type: string
          description: One of G, D, M, F
        team:
          type: string
          description: Short team name from the projection
        price:
          type: number
        ppm:
          type: number
          description: Points per match (total projected points / gameweeks in the projection)
        gwPoints:
          type: array
          items:
            type: number
          description: Per-gameweek projected points, in ascending gameweek order
    PoolFilter:
      type: object
      description: >
        Rank-based pool selection. Within each position players are ranked by
        impact (points per match), value (ppm per £m) and price (cheaper
        better). Per position the top `main` players by the average of impact
        and value ranks are kept, then from the remainder the top `bench`
        players by the average of price and value ranks. Locked players are
        always kept. All counts must be whole numbers between 0 and 500
        (enforced server-side).
      required: [gkMain, gkBench, defMain, defBench, midMain, midBench, fwdMain, fwdBench]
      properties:
        gkMain:
          type: number
          description: Goalkeepers kept by main-squad rank
        gkBench:
          type: number
          description: Additional goalkeepers kept by bench-squad rank
        defMain:
          type: number
          description: Defenders kept by main-squad rank
        defBench:
          type: number
          description: Additional defenders kept by bench-squad rank
        midMain:
          type: number
          description: Midfielders kept by main-squad rank
        midBench:
          type: number
          description: Additional midfielders kept by bench-squad rank
        fwdMain:
          type: number
          description: Forwards kept by main-squad rank
        fwdBench:
          type: number
          description: Additional forwards kept by bench-squad rank
    ChipEval:
      type: object
      description: Raw-points value of a chip measured against a no-chip baseline solve
      required: [chip, gameweek, windowStart, windowEnd, chipPoints, baselinePoints, boost]
      properties:
        chip:
          type: string
        gameweek:
          type: number
        windowStart:
          type: number
        windowEnd:
          type: number
        chipPoints:
          type: number
          description: Unadjusted, undecayed points over the window with the chip
        baselinePoints:
          type: number
          description: Same window from the no-chip baseline solve
        boost:
          type: number
    SolveOptions:
      type: object
      description: Advanced solver settings, mirroring open-fpl-solver config keys
      properties:
        chipEvalThreshold:
          type: ["number", "null"]
          description: Raw-points boost at which an "Any" chip counts as well-invested (display only)
        chipEvalLowerThreshold:
          type: ["number", "null"]
          description: Raw-points boost below which an "Any" chip counts as poor value (display only)
        chipEvalWindow:
          type: ["number", "null"]
          description: Total gameweeks (chip week included) over which chip value is measured
        banned:
          type: array
          items:
            type: string
          description: Player names (or FPL ids) the solver must never pick
        locked:
          type: array
          items:
            type: string
          description: Player names (or FPL ids) the solver must keep in the squad
        noTransferLastGws:
          type: ["number", "null"]
          description: Roll transfers in the last N gameweeks of the horizon
        noFutureTransfer:
          type: ["boolean", "null"]
          description: Only plan transfers for the next gameweek
        numTransfers:
          type: ["number", "null"]
          description: Force an exact number of transfers next gameweek
        hitLimit:
          type: ["number", "null"]
          description: Maximum total points hits over the horizon
        weeklyHitLimit:
          type: ["number", "null"]
          description: Maximum hits in a single gameweek
        decayBase:
          type: ["number", "null"]
          description: Weight of future gameweeks (1 = no decay, lower = focus on near term)
        ftValue:
          type: ["number", "null"]
          description: Value of carrying a free transfer, in points
        itbValue:
          type: ["number", "null"]
          description: Value per 1.0 in the bank, in points
        xminLb:
          type: ["number", "null"]
          description: Exclude players below this many total expected minutes
        secs:
          type: ["number", "null"]
          description: Solver time limit in seconds
        gap:
          type: ["number", "null"]
          description: Acceptable optimality gap (0 = prove optimal)
        randomized:
          type: ["boolean", "null"]
          description: Add noise to projections for alternative solutions
        opposingPlay:
          type: ["string", "null"]
          enum: [off, penalty, forbid, null]
          description: >-
            Handling of zero-sum starting XI matchups (your GK/DEF facing your own
            MID/FWD in the same gameweek). "penalty" discourages them softly,
            "forbid" bans them outright, "off"/null leaves them allowed.
        bookedTransfers:
          type: array
          items:
            $ref: "#/components/schemas/BookedTransfer"
          description: Transfers already decided on; the solver is forced to make them
        numIterations:
          type: ["number", "null"]
          description: >-
            Generate this many plans (1-5). Each extra plan is forced to differ
            from the previous ones in next-gameweek transfers.
        benchWeights:
          type: array
          items:
            type: number
          description: >-
            Objective weights for bench slots in order [GK, 1st, 2nd, 3rd],
            each 0-1 — the odds each bench player ends up scoring. Defaults
            [0.03, 0.21, 0.06, 0.002].
    BookedTransfer:
      type: object
      required: [gameweek]
      properties:
        gameweek:
          type: number
        in:
          type: ["string", "null"]
          description: Player name to transfer in that gameweek
        out:
          type: ["string", "null"]
          description: Player name to transfer out that gameweek
    FixtureInfo:
      type: object
      required: [gameweek, home, away, homeName, awayName, homeDifficulty, awayDifficulty]
      properties:
        gameweek:
          type: ["number", "null"]
        home:
          type: string
          description: Home team short name (3-letter FPL code)
        away:
          type: string
          description: Away team short name (3-letter FPL code)
        homeName:
          type: string
          description: Home team full name
        awayName:
          type: string
          description: Away team full name
        homeDifficulty:
          type: number
          description: FPL fixture difficulty rating (1-5) for the home team
        awayDifficulty:
          type: number
          description: FPL fixture difficulty rating (1-5) for the away team
    SolveRun:
      type: object
      required: [id, status, createdAt, request]
      properties:
        id:
          type: string
        status:
          type: string
          description: One of queued, running, completed, failed
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        request:
          $ref: "#/components/schemas/SolveInput"
        projectionFilename:
          type: ["string", "null"]
        totalExpectedPoints:
          type: ["number", "null"]
        totalBaseExpectedPoints:
          type: ["number", "null"]
          description: Total expected points before differential adjustment (null when k = 0)
        finalGapPercent:
          type: ["number", "null"]
          description: Final optimality gap (%) the solver achieved at completion
        objective:
          type: ["number", "null"]
          description: Solver objective value (decayed, adjusted, incl. bench weights and FT/ITB bonuses)
        chipEval:
          type: ["array", "null"]
          description: Chip value vs a no-chip baseline solve, for "Any"-gameweek chip assignments
          items:
            $ref: "#/components/schemas/ChipEval"
        chipEvalError:
          type: ["string", "null"]
          description: Set when the baseline comparison solve could not be completed
        poolKept:
          type: ["number", "null"]
          description: Players in the solver pool after filtering (null when unfiltered)
        poolTotal:
          type: ["number", "null"]
          description: Total players in the projection when a pool filter was used
        result:
          oneOf:
            - $ref: "#/components/schemas/SolveResult"
            - type: "null"
        progress:
          oneOf:
            - $ref: "#/components/schemas/SolveProgress"
            - type: "null"
        playedChips:
          type: array
          items:
            $ref: "#/components/schemas/PlayedChip"
          description: >
            Chips with their actual gameweeks (from the solved plan when
            completed); optimized=true when the solver chose the timing.
        planCount:
          type: ["number", "null"]
          description: >
            Number of plans the run produced (or was asked for while pending);
            greater than 1 when alternative plans were generated.
    PlayedChip:
      type: object
      required: [chip, gameweek, optimized]
      properties:
        chip:
          type: string
        gameweek:
          type: number
        optimized:
          type: boolean
    MegaScenario:
      type: object
      required: [key, runId, status, chips]
      properties:
        key:
          type: string
          description: One of none, free, only-wildcard, only-bench_boost, only-free_hit, only-triple_captain
        runId:
          type: string
        status:
          type: string
          description: One of queued, running, completed, failed
        totalExpectedPoints:
          type: ["number", "null"]
        totalBaseExpectedPoints:
          type: ["number", "null"]
          description: Total using unadjusted projections, when a differential factor was applied
        deltaVsBaseline:
          type: ["number", "null"]
          description: Points gained vs the no-chips baseline (null until both completed)
        chips:
          type: array
          items:
            $ref: "#/components/schemas/ChipAssignment"
          description: Chips the solver chose to play in this scenario
        progress:
          oneOf:
            - $ref: "#/components/schemas/SolveProgress"
            - type: "null"
          description: Live solver progress while this scenario is running
        finalGapPercent:
          type: ["number", "null"]
          description: Final optimality gap (%) the solver achieved for this scenario
    MegaRun:
      type: object
      required: [id, status, createdAt, projectionId, horizon, chipWindow, scenarios]
      properties:
        id:
          type: string
        status:
          type: string
          description: One of queued, running, completed, failed
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        projectionId:
          type: string
        projectionFilename:
          type: ["string", "null"]
        horizon:
          type: number
        chipWindow:
          type: array
          items:
            type: number
          description: Gameweeks in which chips are allowed to be played
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/MegaScenario"
    SolveProgress:
      type: object
      required: [stage, message]
      properties:
        stage:
          type: string
          description: One of preparing, pool, solving, finalizing
        message:
          type: string
        gapPercent:
          type: ["number", "null"]
          description: Current optimality gap while the MIP solver runs
    SolvePlan:
      type: object
      required: [gameweeks, totalExpectedPoints]
      properties:
        totalExpectedPoints:
          type: number
        totalBaseExpectedPoints:
          type: ["number", "null"]
          description: Total using unadjusted projections, when a differential factor was applied
        gameweeks:
          type: array
          items:
            $ref: "#/components/schemas/GameweekPlan"
    SolveResult:
      type: object
      required: [gameweeks, totalExpectedPoints]
      properties:
        totalExpectedPoints:
          type: number
        totalBaseExpectedPoints:
          type: ["number", "null"]
          description: Total using unadjusted projections, when a differential factor was applied
        gameweeks:
          type: array
          items:
            $ref: "#/components/schemas/GameweekPlan"
        alternatives:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/SolvePlan"
          description: Alternative plans from multi-iteration solves (the main plan is not repeated)
    GameweekPlan:
      type: object
      required: [gameweek, lineup, bench, expectedPoints, transfersIn, transfersOut]
      properties:
        gameweek:
          type: number
        chip:
          type: ["string", "null"]
          description: Chip played this gameweek, if any
        expectedPoints:
          type: number
        baseExpectedPoints:
          type: ["number", "null"]
          description: Gameweek total using unadjusted projections, when a differential factor was applied
        bank:
          type: ["number", "null"]
        freeTransfers:
          type: ["number", "null"]
          description: Free transfers available going into this gameweek
        lineup:
          type: array
          items:
            $ref: "#/components/schemas/PickPlayer"
        bench:
          type: array
          items:
            $ref: "#/components/schemas/PickPlayer"
        transfersIn:
          type: array
          items:
            type: string
        transfersOut:
          type: array
          items:
            type: string
    PickPlayer:
      type: object
      required: [name, team, position, price, expectedPoints, isCaptain, isViceCaptain]
      properties:
        id:
          type: ["string", "null"]
          description: Stable player ID from the projection/solver data, when available
        name:
          type: string
        team:
          type: string
        position:
          type: string
          description: One of G, D, M, F
        price:
          type: number
        expectedPoints:
          type: number
        basePoints:
          type: ["number", "null"]
          description: Unadjusted projected points, when a differential factor was applied
        isCaptain:
          type: boolean
        isViceCaptain:
          type: boolean
        benchOrder:
          type: ["number", "null"]
          description: 0-3 for bench players, null for starters
        ownership:
          type: ["number", "null"]
          description: Ownership percentage from the projection file, when available
