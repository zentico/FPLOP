kind = "mobile"
previewPath = "/mobile/"
title = "FPLOP Mobile"
description = "A mobile companion app for the FPL Team Optimizer (FPLOP). Lets users view solve history, start solves, and review multi-gameweek transfer plans — lineup, bench, transfers, and fixtures — on the go, connecting to the existing shared API server."
version = "1.0.0"
id = "artifacts/fplop-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18909

[services.development]
run = "pnpm --filter @workspace/fplop-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fplop-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fplop-mobile", "run", "serve" ]

[services.env]
PORT = "18909"
BASE_PATH = "/mobile/"
